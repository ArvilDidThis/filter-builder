name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs can only read the repo
permissions:
  contents: read

# Jobs run on GitHub's own machines. Each job gets a fresh, empty machine, so code from a pull
# request never runs on a machine that is kept.
jobs:
  check:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit (with the version in a comment) so a moved tag
      # can't change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json ("packageManager")
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # Lint, type checks, tests, build, the check that the main entry imports no packages,
      # and the tests for the review's API script (.github/scripts)
      - run: pnpm verify
