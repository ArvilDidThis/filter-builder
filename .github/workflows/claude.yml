name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One Claude run per issue or PR at a time. Later mentions queue rather than cancel, so a
# reply that's already being written isn't thrown away. `queue: max` keeps every waiting
# mention (up to 100); by default a newer waiting run would replace an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

# No permissions by default; the job below asks for only what it needs
permissions: {}

jobs:
  claude:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # Repo access is read-only: Claude writes its comments with the Claude GitHub App's token
      contents: read # read the code
      pull-requests: read # read the PR and its diff
      issues: read # read issue and PR conversations
      id-token: write # exchange a GitHub OIDC token for the Claude GitHub App token
      actions: read # read CI results on PRs
    steps:
      # Keeps the checkout's git credentials (no `persist-credentials: false`), so zizmor's
      # artipacked audit is silenced for this step only: claude-code-action runs its own
      # `git fetch` with them and fails without them. Safe while the action is pinned and is
      # the only step after checkout; if a step is ever added after it, re-check this.
      - name: Checkout repository # zizmor: ignore[artipacked]
        # Pinned to a full commit (version in the comment), like every other workflow here
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to a release at least 7 days old, matching the Dependabot cooldown
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
